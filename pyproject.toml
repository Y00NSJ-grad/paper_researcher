[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-radar"
version = "0.1.0"
description = "Personal research trend radar with multi-source scholarly metadata collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
paper-radar = "radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

